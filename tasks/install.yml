---
- name: Assert a supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: This role installs Tailscale from the Debian/Ubuntu apt repository only.

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - python3-debian # required by ansible.builtin.deb822_repository
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the Tailscale package signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/{{ tailscale_apt_track }}/{{ tailscale_apt_distribution }}/{{ tailscale_apt_codename }}.noarmor.gpg"
    dest: "{{ tailscale_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure the Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/{{ tailscale_apt_track }}/{{ tailscale_apt_distribution }}"
    suites: ["{{ tailscale_apt_codename }}"]
    components: [main]
    signed_by: "{{ tailscale_apt_keyring }}"
    state: present

- name: Install the tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: "{{ tailscale_package_state }}"
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
