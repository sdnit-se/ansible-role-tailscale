[tools]
ansible-core = "2.21.3"
"pipx:ansible-lint" = "26.8.0"
"pipx:yamllint" = "1.38.0"
actionlint = "1.7.12"
pipx = "1.17.1"
shellcheck = "0.11.0"

[tasks.check]
description = "yamllint, ansible-lint, syntax check, actionlint"
shell = "bash -c"
run = """
set -euo pipefail
# Expose this checkout as role "tailscale" without a symlink in the tree
# (consumers install the whole repo, and symlinks break archive builds).
roles="$(mktemp -d)"; trap 'rm -rf "$roles"' EXIT
ln -s "$PWD" "$roles/tailscale"
export ANSIBLE_ROLES_PATH="$roles"
yamllint .
ansible-lint
ansible-playbook --syntax-check -i localhost, tests/playbook.yml
actionlint
"""
